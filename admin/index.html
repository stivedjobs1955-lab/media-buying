<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unique — Admin panel</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div class="brand"><img src="/images/logo-mark.png" alt="Unique Logo" class="brand-logo-img"> <span>Unique CRM</span></div>
    <div class="login-error hidden" id="loginError"></div>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" value="admin@unique.uz">
      </div>
      <div class="field">
        <label for="password">Parol</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Kirish</button>
    </form>
  </div>
</div>

<div id="dashboardView" class="hidden">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><img src="/images/logo-mark.png" alt="Unique Logo" class="brand-logo-img"> <span>Unique CRM</span></div>
      <div class="topbar-right">
        <span id="adminEmail"></span>
        <button class="btn-secondary" id="openPasswordModalBtn">🔑 Parolni o'zgartirish</button>
        <button class="btn-secondary" id="downloadContractBtn">Shartnomani yuklab olish</button>
        <button class="btn-secondary" id="logoutBtn">Chiqish</button>
      </div>
    </div>
  </div>

  <!-- Parolni o'zgartirish modali -->
  <div id="passwordModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3>🔑 Parolni o'zgartirish</h3>
        <button class="modal-close" id="closePasswordModalBtn">&times;</button>
      </div>
      <div id="passwordAlert" class="hidden"></div>
      <form id="passwordForm">
        <div class="field">
          <label for="currentPassword">Joriy parol</label>
          <input type="password" id="currentPassword" required placeholder="Hozirgi parolingiz">
        </div>
        <div class="field">
          <label for="newPassword">Yangi parol</label>
          <input type="password" id="newPassword" required minlength="6" placeholder="Kamida 6 ta belgi">
        </div>
        <div class="field">
          <label for="confirmPassword">Yangi parolni tasdiqlang</label>
          <input type="password" id="confirmPassword" required minlength="6" placeholder="Yangi parolni qayta tering">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelPasswordBtn">Bekor qilish</button>
          <button type="submit" class="btn-primary" style="width:auto;">Saqlash</button>
        </div>
      </form>
    </div>
  </div>

  <div class="main">
    <div class="stat-grid">
      <div class="stat-card">
        <div class="label">Jami lidlar</div>
        <div class="value" id="statTotalLeads">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Bugungi lidlar</div>
        <div class="value flow" id="statTodayLeads">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Jami tashriflar</div>
        <div class="value" id="statViews">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Konversiya (lid / tashrif)</div>
        <div class="value flow" id="statConversion">0%</div>
      </div>
    </div>

    <div class="panels">
      <div class="panel">
        <h3>Byudjet bo'yicha lidlar</h3>
        <div id="budgetBars"></div>
      </div>
      <div class="panel">
        <h3>So'nggi 7 kun</h3>
        <div class="trend-row" id="trendRow"></div>
        <div class="trend-legend">
          <span><i class="dot" style="background:var(--flow-600);"></i> Lidlar</span>
          <span><i class="dot" style="background:var(--ink-200);"></i> Tashriflar</span>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:24px;">
      <h3>Kunlik tashriflar</h3>
      <div class="day-filter-row">
        <input type="date" id="dayFilterInput">
        <button class="btn-secondary" id="dayFilterBtn">Ko'rish</button>
        <button class="btn-secondary" id="dayFilterTodayBtn">Bugun</button>
      </div>
      <div class="day-stat-row" id="dayStatRow"></div>
      <div id="dayPathsWrap"></div>
    </div>

    <div class="leads-section">
      <div class="leads-head">
        <h3>Lidlar (CRM)</h3>
      </div>
      <div class="kanban-board" id="kanbanBoard"></div>
    </div>

    <div class="leads-section" style="margin-top:24px;">
      <div class="leads-head">
        <h3>📅 Kalendar — konsultatsiyalar</h3>
        <div class="status-tabs" id="calRangeTabs">
          <button class="status-tab active" data-range="day">Kun</button>
          <button class="status-tab" data-range="week">Hafta</button>
          <button class="status-tab" data-range="month">Oy</button>
        </div>
      </div>
      <div class="admin-cal-wrap">
        <div class="admin-cal-nav">
          <button class="btn-secondary" id="adminCalPrev">‹ Oldingi</button>
          <span id="adminCalLabel"></span>
          <button class="btn-secondary" id="adminCalNext">Keyingi ›</button>
        </div>
        <div class="admin-cal-grid" id="adminCalGrid"></div>
      </div>
      <div class="table-wrap">
        <table class="leads-table">
          <thead>
            <tr>
              <th>Sana</th><th>Vaqt</th><th>Ism</th><th>Telefon</th><th>Google Meet</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="bookingsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
